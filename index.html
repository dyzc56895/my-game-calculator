<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>遊戲物品與材料配方計算器</title>
    <style>
        :root { --bg: #f4f7f6; --card: #ffffff; --primary: #4a90e2; --danger: #e74c3c; --success: #2ecc71; --text: #333; --border: #ddd; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; }
        .card { background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; border-bottom: 2px solid var(--primary); padding-bottom: 10px; color: var(--primary); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; }
        .material-row { display: grid; grid-template-columns: 2fr 1fr auto; gap: 10px; margin-bottom: 10px; }
        button { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; width: 100%; margin-top: 10px; font-size: 16px; }
        .btn-danger { background: var(--danger); color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid var(--border); padding: 12px; text-align: left; }
        th { background: #f8f9fa; }
        .checkbox-cell { text-align: center; width: 40px; }
        .checkbox-cell input { transform: scale(1.3); cursor: pointer; }
        .qty-input { width: 80px !important; text-align: center; }
        .summary-box { margin-top: 30px; background: #eef5fc; padding: 20px; border-radius: 8px; border-left: 5px solid var(--primary); }
        .empty-hint { color: #999; text-align: center; padding: 40px 0; font-style: italic; }
    </style>
</head>
<body>
    <h1 style="text-align: center; color: #2c3e50;">🎮 遊戲物品與材料配方計算器</h1>
    <div class="container">
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <div class="card">
                <h2>➕ 新增/管理物品配方</h2>
                <div class="form-group"><label>物品名稱：</label><input type="text" id="itemName" placeholder="例如：高級祝福繃帶"></div>
                <div class="form-group"><label>功能/功效：</label><input type="text" id="itemFunction" placeholder="例如：持續創傷"></div>
                <div class="form-group">
                    <label>配方材料設定：</label>
                    <div id="matContainer">
                        <div class="material-row">
                            <input type="text" class="mat-name" placeholder="材料名稱">
                            <input type="number" class="mat-qty" placeholder="數量" min="1">
                            <button class="btn-danger" onclick="this.parentElement.remove()">X</button>
                        </div>
                    </div>
                    <button class="btn-primary" style="margin-top:5px; padding:5px 10px; font-size:13px;" onclick="addMatRow()">+ 增加材料種類</button>
                </div>
                <button class="btn-success" onclick="saveRecipe()">💾 儲存配方至庫存</button>
            </div>
            <div class="card">
                <h2>📦 物品配方庫（勾選欲製作項目）</h2>
                <table>
                    <thead><tr><th class="checkbox-cell">勾選</th><th>物品名稱</th><th>功效</th><th>材料明細</th></tr></thead>
                    <tbody id="recipeTableBody"></tbody>
                </table>
            </div>
        </div>
        <div class="right-panel">
            <div class="card" style="min-height: 500px;">
                <h2>🧮 智慧材料大計算表</h2>
                <div id="emptyHint" class="empty-hint">請在左側勾選想要製作的物品...</div>
                <table id="calcTable" style="display: none;">
                    <thead><tr><th>已勾選名稱</th><th style="width: 120px;">輸入製作數量</th></tr></thead>
                    <tbody id="calcTableBody"></tbody>
                </table>
                <div id="summaryBox" class="summary-box" style="display: none;">
                    <h3>📋 最終所需材料總購物清單</h3>
                    <table>
                        <thead><tr style="background:#e2edf8;"><th>材料名稱</th><th>數量總數</th></tr></thead>
                        <tbody id="summaryTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script>
        let recipes = [
            { id: 1, name: "恢復藥水", func: "補260HP", materials: [{name: "血紅藥草", qty: 2}, {name: "新芽蘑菇", qty: 2}] },
            { id: 2, name: "高級恢復藥水x5", func: "補1600HP", materials: [{name: "血紅藥草", qty: 6}, {name: "新芽蘑菇汁液", qty: 5}, {name: "啾啾蘑菇", qty: 2}] },
            { id: 3, name: "耐熱繃帶", func: "持續灼傷", materials: [{name: "繃帶", qty: 5}, {name: "壯壯蘑菇粉末", qty: 3}, {name: "火苗結晶", qty: 1}] },
            { id: 4, name: "高級祝福繃帶", func: "持續創傷", materials: [{name: "高級繃帶", qty: 5}, {name: "躲躲花粉末", qty: 6}, {name: "光輝結晶", qty: 2}] },
            { id: 5, name: "高級封印繃帶", func: "持續創傷", materials: [{name: "高級繃帶", qty: 5}, {name: "躲躲花粉末", qty: 6}, {name: "封印結晶", qty: 2}] }
        ];
        let selectedItems = {};
        window.onload = function() { renderRecipes(); };
        function addMatRow() {
            const div = document.createElement('div'); div.className = 'material-row';
            div.innerHTML = `<input type="text" class="mat-name" placeholder="材料名稱"><input type="number" class="mat-qty" placeholder="數量" min="1"><button class="btn-danger" onclick="this.parentElement.remove()">X</button>`;
            document.getElementById('matContainer').appendChild(div);
        }
        function saveRecipe() {
            const name = document.getElementById('itemName').value.trim();
            const func = document.getElementById('itemFunction').value.trim();
            const names = document.querySelectorAll('.mat-name'); const qtys = document.querySelectorAll('.mat-qty');
            if(!name) return alert('請填物品名稱');
            let mats = [];
            for(let i=0; i<names.length; i++) {
                if(names[i].value.trim() && parseInt(qtys[i].value) > 0) mats.push({ name: names[i].value.trim(), qty: parseInt(qtys[i].value) });
            }
            if(mats.length===0) return alert('請填材料');
            recipes.push({ id: Date.now(), name: name, func: func, materials: mats });
            renderRecipes();
        }
        function renderRecipes() {
            const tbody = document.getElementById('recipeTableBody'); tbody.innerHTML = '';
            recipes.forEach(r => {
                let tr = document.createElement('tr');
                tr.innerHTML = `<td class="checkbox-cell"><input type="checkbox" onchange="toggleSelect(${r.id}, this.checked)"></td><td><b>${r.name}</b></td><td>${r.func}</td><td>${r.materials.map(m=>`${m.name}x${m.qty}`).join(', ')}</td>`;
                tbody.appendChild(tr);
            });
        }
        function toggleSelect(id, chk) { chk ? selectedItems[id] = "" : delete selectedItems[id]; renderCalcTable(); }
        function renderCalcTable() {
            const keys = Object.keys(selectedItems);
            document.getElementById('emptyHint').style.display = keys.length === 0 ? 'block' : 'none';
            document.getElementById('calcTable').style.display = keys.length === 0 ? 'none' : 'table';
            if(keys.length === 0) { document.getElementById('summaryBox').style.display = 'none'; return; }
            const tbody = document.getElementById('calcTableBody'); tbody.innerHTML = '';
            keys.forEach(id => {
                let r = recipes.find(x => x.id == id);
                let tr = document.createElement('tr');
                tr.innerHTML = `<td><b>${r.name}</b></td><td><input type="number" class="qty-input" placeholder="請輸入" value="${selectedItems[id]}" oninput="updateQty(${id}, this.value)"></td>`;
                tbody.appendChild(tr);
            });
            calc();
        }
        function updateQty(id, val) { selectedItems[id] = val === "" ? "" : parseInt(val); calc(); }
        function calc() {
            let totals = {}; let valid = false;
            Object.keys(selectedItems).forEach(id => {
                let q = selectedItems[id];
                if(q && q > 0) {
                    valid = true;
                    recipes.find(x => x.id == id).materials.forEach(m => { totals[m.name] = (totals[m.name] || 0) + (m.qty * q); });
                }
            });
            document.getElementById('summaryBox').style.display = valid ? 'block' : 'none';
            const tbody = document.getElementById('summaryTableBody'); tbody.innerHTML = '';
            Object.keys(totals).forEach(k => { tbody.innerHTML += `<tr><td><b>${k}</b></td><td style="color:var(--danger);font-weight:bold;">${totals[k]}</td></tr>`; });
        }
    </script>
</body>
</html>
